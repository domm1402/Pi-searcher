name: Build Pi Searcher APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pi-searcher-android
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and bundle 100 million digits of pi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -L --fail --retry 4 --retry-all-errors https://files.pilookup.com/pi/1-100000000.zip -o /tmp/pi.zip
          TXT_PATH="$(unzip -Z1 /tmp/pi.zip | awk 'tolower($0) ~ /[.]txt$/ {print; exit}')"
          test -n "$TXT_PATH"
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("/tmp/pi.zip")
          name = next(n for n in z.namelist() if n.lower().endswith(".txt"))
          total = 0
          with z.open(name) as src, open("/tmp/pi-digits.txt", "wb") as dst:
              while total < 100_000_000:
                  chunk = src.read(1024 * 1024)
                  if not chunk:
                      break
                  digits = bytes(c for c in chunk if 48 <= c <= 57)
                  take = digits[:100_000_000-total]
                  dst.write(take)
                  total += len(take)
          assert total == 100_000_000, f"Expected 100M digits, got {total}"
          PY
          gzip -9 -c /tmp/pi-digits.txt > app/src/main/assets/pi-100m.txt.gz
          echo "Bundled $(wc -c < /tmp/pi-digits.txt) digits; compressed asset: $(du -h app/src/main/assets/pi-100m.txt.gz | cut -f1)"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          python3 - <<'PY'
          import gzip, zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
              candidates = [n for n in z.namelist() if "pi-100m" in n.lower()]
              print("Pi asset candidates:", candidates)
              assert candidates, "Pi dataset is missing from the APK"
              valid = False
              for name in candidates:
                  data = z.read(name)
                  try:
                      raw = gzip.decompress(data)
                  except OSError:
                      raw = data
                  if len(raw) == 100_000_000 and all(48 <= c <= 57 for c in raw):
                      valid = True
                      print(f"Verified {name}: exactly 100,000,000 digits")
                      break
              assert valid, "No packaged Pi asset contains exactly 100M digits"
          PY
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pi-Searcher-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
