name: Deploy Pi Searcher to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Bundle the 100-million-digit pi dataset
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://files.pilookup.com/pi/1-100000000.zip -o /tmp/pi-100m.zip
          TXT_PATH="$(unzip -Z1 /tmp/pi-100m.zip | grep -i '\\.txt        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
